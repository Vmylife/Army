<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#b8cbb1"><title>國軍模擬器｜v0.5 大型軍營地圖測試</title><link rel="stylesheet" href="./src/ui/playtest.css?v=050"></head><body>
<canvas id="world" aria-label="3D 國軍軍營遊戲測試場景"></canvas>
<header class="hud"><section class="title"><b>🪖 報告班長！</b><small>大型開放軍營 · 移動加速 v0.5</small></section><div class="stats"><b id="fps">-- FPS</b><span id="state">載入中</span></div></header>
<div id="notice" class="notice">模型載入中…</div>
<div id="label" class="label">📍 新訓中心 · 集合場</div>
<aside id="minimap" class="minimap"><div class="minimap-title">🗺️ 營區地圖 <button id="mapToggle" type="button">收合</button></div><canvas id="miniCanvas" width="300" height="250" aria-label="軍營小地圖"></canvas><small>白框：你　紅點：敵人</small></aside>
<div id="enemyStatus" class="enemy-status">🔴 紅隊菜兵　HP 3/3</div>
<div id="tip" class="tip">左下搖桿移動（已加速） · 拖曳空白處旋轉鏡頭</div>
<footer class="bottom"><div id="joy" class="joy"><div id="nub" class="nub"><span>+</span></div></div><section class="controls"><div class="controls-heading"><span>🎬 動作測試</span><button id="resetCamera" class="mini">鏡頭復位</button></div><div id="moves" class="moves"></div><div class="controls-lower"><button id="attack" class="attack">🥊 測試攻擊</button><button id="resetEnemy" class="mini">重置敵人</button><label><input type="checkbox" id="ecoview">省電模型</label></div></section></footer>
<div id="fatal" class="fatal" hidden></div>
<script type="module" src="./src/main.js?v=050"></script></body></html>
