<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b8cbb1">
  <title>國軍模擬器｜大型軍營</title>
  <link rel="stylesheet" href="./src/ui/playtest.css?v=051">
</head>
<body>
  <canvas id="world" aria-label="3D 軍營地圖：螢幕中下方滑動移動，螢幕上方拖曳旋轉鏡頭"></canvas>
  <aside id="minimap" class="minimap collapsed">
    <div class="minimap-title"><span>🗺️ 地圖</span><button id="mapToggle" type="button" aria-expanded="false">展開</button></div>
    <canvas id="miniCanvas" width="300" height="250" aria-label="軍營小地圖"></canvas>
    <small>白框：你　紅點：敵人</small>
  </aside>
  <div id="floatingStick" class="floating-stick" aria-hidden="true">
    <div class="stick-base"><div id="stickThumb" class="stick-thumb"></div></div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="fatal" class="fatal" hidden></div>
  <script type="module" src="./src/main.js?v=051"></script>
</body>
</html>
