<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#162a20"/>
<title>國軍模擬器｜戰鬥實驗場 v0.11.0</title>
<link rel="stylesheet" href="./src/combat/battle.css?v=0110"/>
</head>
<body>
<div id="stage">
  <canvas id="battle3d" aria-label="3D 戰鬥場景"></canvas>
  <canvas id="effects" aria-hidden="true"></canvas>
  <div id="hud" hidden>
    <div class="hud-row">
      <div class="stat"><span class="quiet">主角生命</span><div class="health"><i id="hpfill"></i></div><b id="hptext">200 / 200</b></div>
      <div class="stat"><span class="quiet">擊殺</span><b id="kills">0</b></div>
      <div class="stat"><span class="quiet">波次</span><b id="wave">1</b></div>
      <div class="stat"><span class="quiet">存活</span><b id="timer">0:00</b></div>
    </div>
    <div class="hud-tools">
      <button id="speed" type="button" aria-label="調整戰鬥速度">速度 1×</button>
      <button id="zoomOut" type="button" aria-label="鏡頭拉遠">－</button>
      <button id="zoomIn" type="button" aria-label="鏡頭拉近">＋</button>
      <button id="sound" type="button" aria-label="切換音效">音效 關</button>
    </div>
    <p id="modeTag">普通士兵</p>
  </div>
  <div id="menu" class="scrim">
    <section class="panel intro">
      <span class="eyebrow">ARMY · EXPERIMENT 0110</span>
      <h1>國軍模擬器<br/><strong>戰鬥實驗場</strong></h1>
      <p>一個綠色阿兵哥，對上源源不絕的紅色敵軍。<br/>自動跑位、自動射擊，看看你的小兵能撐多久。</p>
      <div class="choices" role="group" aria-label="測試士兵能力">
        <button class="choice active" data-mode="normal" aria-pressed="true"><b>普通士兵</b><small>適合測試基本戰鬥</small></button>
        <button class="choice" data-mode="elite" aria-pressed="false"><b>超強士兵</b><small>火力全開，測試清場爽感</small></button>
      </div>
      <button class="primary" id="start" type="button">開始觀戰</button>
      <p class="hint">戰場獨立測試，不會更改你的軍營。<br/>手機可直接開啟，建議先用普通速度測試。</p>
      <a class="return" href="./index.html">返回軍營首頁</a>
    </section>
  </div>
  <div id="loading" class="scrim" hidden><section class="panel waiting"><span class="eyebrow">LOADING</span><h2>士兵正在集結…</h2><p id="loadMsg">建立戰場</p><div class="progress"><i id="loadBar"></i></div><b id="loadPercent">0%</b><p class="hint">第一次開啟需要下載既有士兵模型和武器。</p></section></div>
  <div id="end" class="scrim" hidden><section class="panel"><span class="eyebrow">BATTLE REPORT</span><h2 id="endTitle">戰鬥結束</h2><p id="endSummary"></p><div class="end-actions"><button class="primary" id="again">再戰一次</button><button id="backMenu">回到選擇畫面</button></div></section></div>
  <div id="fatal" class="scrim" hidden><section class="panel"><h2>載入失敗</h2><p id="errorText"></p><button class="primary" id="retry">重新載入</button></section></div>
</div>
<script type="module" src="./src/combat/main.js?v=0110"></script>
</body></html>
