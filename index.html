<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b7c9b2">
<title>國軍模擬器｜Army</title>
<link rel="stylesheet" href="./src/ui/playtest.css?v=070">
</head>
<body>
<canvas id="world" aria-label="國軍模擬器 3D 軍營"></canvas>
<button id="minimap" type="button" aria-label="開啟新兵訓練營地圖" title="開啟新兵訓練營地圖"><canvas id="miniCanvas" width="224" height="224" aria-hidden="true"></canvas></button>
<section id="worldMap" class="world-map" role="dialog" aria-label="新兵訓練營地圖" aria-modal="true" hidden>
  <div class="world-map-panel">
    <header class="world-map-header"><div><strong>🗺️ 新兵訓練營地圖</strong><small>依照新兵訓練營 22.0 配置 · 藍色箭頭是你</small></div><button id="closeWorldMap" type="button" aria-label="關閉大地圖">✕</button></header>
    <div class="world-map-body"><div class="map-canvas-holder"><canvas id="worldMapCanvas" aria-label="完整軍營地圖，顯示所有地點和自身方向"></canvas></div><div class="world-map-places"><strong>營區地點</strong><div id="worldMapPlaceList" class="world-map-place-grid"></div></div></div>
    <div class="world-map-footer"><span><i class="marker player"></i> 你</span><span><i class="marker enemy"></i> 紅隊</span><span><i class="marker spot"></i> 訓練與設施</span></div>
  </div>
</section>
<div id="floatingStick" aria-hidden="true"><div class="stick-base"><div id="stickThumb" class="stick-thumb"></div></div></div>
<div id="notice" role="status">載入阿兵哥…</div>
<div id="fatal" role="alert" hidden><strong>遊戲無法啟動</strong><p id="errorText"></p><button type="button" id="retry">重新載入</button></div>
<div id="debug" hidden></div>
<script type="module" src="./src/main.js?v=071"></script>
</body>
</html>
